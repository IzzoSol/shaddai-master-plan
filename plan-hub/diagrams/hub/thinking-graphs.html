<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Seven Ways of Thinking — bars, donut, tree, flow</title>
<style>
  :root { --bg:#070a0e; --panel:#0b1117; --line:rgba(126,158,142,.20); --line-2:rgba(126,158,142,.36);
    --txt:#e8f0ea; --dim:#8fa39a; --accent:#00e5a0; --gold:#f5c542; --violet:#8b5cf6; --cyan:#3fe8ff;
    --pink:#f472b6; --blue:#38bdf8; --font:'Rajdhani','Inter',system-ui,sans-serif; --mono:'Share Tech Mono',ui-monospace,monospace; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--txt); font:15px/1.5 var(--font); padding:22px;
    background-image:radial-gradient(circle at 15% 0%,rgba(0,229,160,.06),transparent 46%); }
  .wrap { max-width:1000px; margin:0 auto; }
  h1 { font-size:28px; } h1 em { font-style:normal; color:var(--accent); }
  .sub { color:var(--dim); font:12px var(--mono); margin:6px 0 14px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  button, a.btn { font:600 11px/1 var(--font); letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
    min-height:32px; padding:0 13px; border-radius:8px; border:1px solid var(--line-2);
    background:var(--panel); color:var(--txt); text-decoration:none; display:inline-flex; align-items:center; }
  button.on, button:hover, a.btn:hover { border-color:var(--accent); color:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:12px; }
  .view { display:none; } .view.on { display:block; animation:rise .45s cubic-bezier(.16,1,.3,1) both; }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  svg { width:100%; height:auto; display:block; }
  .blabel { fill:var(--txt); font:600 12px var(--font); } .bval { fill:var(--dim); font:11px var(--mono); }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  th { text-align:left; color:var(--dim); font:10px var(--mono); padding:6px; border-bottom:1px solid var(--line); }
  td { padding:7px 6px; border-bottom:1px solid rgba(126,158,142,.12); }
  td.r, th.r { text-align:right; font-family:var(--mono); }
  ul.tree, ul.tree ul { list-style:none; margin-left:18px; padding-left:14px; border-left:1px solid var(--line-2); }
  ul.tree > li { margin:8px 0; } ul.tree li li { margin:4px 0; color:var(--dim); font-size:13px; }
  ul.tree b { color:var(--txt); } ul.tree .use { color:var(--accent); font:11px var(--mono); }
  .wall { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; margin-top:10px; }
  .wall figure { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#04070a; }
  .wall img { width:100%; height:170px; object-fit:cover; object-position:top; display:block; }
  .wall figcaption { font:10px var(--mono); color:var(--dim); padding:6px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Seven Ways of <em>Thinking</em></h1>
  <div class="sub">ONE DATA SET · FOUR GRAPHS · bars / donut / tree / flow · source posters below · diagram in portfolio/thinking/</div>
  <div class="btns">
    <button data-v="bars" class="on">Bars</button>
    <button data-v="donut" class="">Donut</button>
    <button data-v="tree" class="">Tree</button>
    <button data-v="flow" class="">Flow</button>
    <a class="btn" href="../thinking/thinking.html">Gated diagram →</a>
    <a class="btn" href="../master/master.html">Master map →</a>
  </div>
  <div class="card"><div class="view on" id="v-bars"></div><div class="view" id="v-donut"></div><div class="view" id="v-tree"></div><div class="view" id="v-flow"></div></div>
  <div class="card"><table id="tbl"><thead><tr><th>SYSTEM</th><th>ELEMENTS</th><th>SHADDAI USE</th></tr></thead><tbody></tbody></table></div>
  <div class="card"><div class="sub">SOURCE POSTERS (local files)</div><div class="wall" id="wall"></div></div>
</div>
<script>
const DATA = [
  { id:'diderot', name:'Diderot tree', color:'#f5c542', items:['Memory','Reason','Imagination'], use:'NEXUS brain taxonomy' },
  { id:'organ', name:'Graphic organisers', color:'#00e5a0', items:['Recall','Sequence','Cause-effect','Analysis','Decide'], use:'ORACLE briefs' },
  { id:'behav', name:'9 Behaviours', color:'#f472b6', items:['Clarity','Accuracy','Precision','Relevance','Depth','Breadth','Logic','Fairness','Significance'], use:'QUILL + PIKADON vetting' },
  { id:'paradox', name:'20 Paradoxes', color:'#8b5cf6', items:['Growth','Effort','Failure','Money','Speed'], use:'ZEROX content' },
  { id:'logic', name:'7 Logics', color:'#38bdf8', items:['Deductive','Inductive','Abductive','Fuzzy','Dialectical'], use:'NEXUS reasoning' },
  { id:'values', name:'Values map', color:'#3fe8ff', items:['Self-direction','Achievement','Benevolence','Security'], use:'TURTLE brand voice' },
  { id:'maps', name:'Thinking Maps', color:'#e8f0ea', items:['Circle','Bubble','Tree','Flow','Bridge'], use:'Academy drills' },
];
const POSTERS = [
  ['file:///C:/Users/Brittany/OneDrive/Pictures/d080c9ba5f6657a08666d7eb172d8e49.jpg','Diderot tree'],
  ['file:///C:/Users/Brittany/OneDrive/Pictures/1eef6349518d0f58d93bbc5e1a4d708b.jpg','Organisers'],
  ['file:///C:/Users/Brittany/OneDrive/Pictures/9e5b9b64a687946a97f4aa1f6883e09f.jpg','9 Behaviours'],
  ['file:///C:/Users/Brittany/OneDrive/Pictures/58de875f7d5bf622a4d22bc0f3cbc023.jpg','20 Paradoxes'],
  ['file:///C:/Users/Brittany/OneDrive/Pictures/3155af4dc7702bae382e55d59f6933ad.jpg','7 Logics'],
  ['file:///C:/Users/Brittany/OneDrive/Pictures/a2e7b9a7543525a5493e1d90ea04e169.jpg','Values map'],
  ['file:///C:/Users/Brittany/OneDrive/Pictures/a191c76600d8401b9c2519b2a564ca23.jpg','Thinking Maps'],
];
const max = Math.max(...DATA.map(d=>d.items.length));
// BARS
document.getElementById('v-bars').innerHTML =
  `<svg viewBox="0 0 900 ${DATA.length*64+30}">` + DATA.map((d,i)=>{
    const w = (d.items.length/max)*640;
    return `<text x="0" y="${i*64+26}" class="blabel">${d.name}</text>` +
      `<rect x="210" y="${i*64+8}" width="${w}" height="26" rx="6" fill="${d.color}" opacity="0.85">` +
      `<animate attributeName="width" from="0" to="${w}" dur="0.7s" fill="freeze"/></rect>` +
      `<text x="${218+w}" y="${i*64+27}" class="bval">${d.items.length}</text>`;
  }).join('') + `</svg>`;
// DONUT
(function(){
  const total = DATA.reduce((s,d)=>s+d.items.length,0);
  let acc = 0; const R = 120, C = 2*Math.PI*R;
  const segs = DATA.map(d=>{
    const frac = d.items.length/total, s = `<circle cx="160" cy="140" r="${R}" fill="none" stroke="${d.color}" stroke-width="34" stroke-dasharray="${(frac*C).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-acc*C).toFixed(1)}" transform="rotate(-90 160 140)" opacity="0.9"><title>${d.name} ${d.items.length}</title></circle>`;
    acc += frac; return s;
  }).join('');
  const leg = DATA.map((d,i)=>`<text x="330" y="${40+i*32}" class="blabel" fill="${d.color}">■</text><text x="352" y="${40+i*32}" class="blabel">${d.name} — ${d.items.length}</text>`).join('');
  document.getElementById('v-donut').innerHTML =
    `<svg viewBox="0 0 640 300">${segs}<text x="160" y="134" text-anchor="middle" class="blabel" font-size="26">${total}</text><text x="160" y="156" text-anchor="middle" class="bval">elements</text>${leg}</svg>`;
})();
// TREE
document.getElementById('v-tree').innerHTML =
  `<ul class="tree"><li><b>Seven Ways of Thinking</b> <span class="use">teach order</span><ul>` +
  DATA.map(d=>`<li><b>${d.name}</b> <span class="use">${d.use}</span><ul>` +
    d.items.map(it=>`<li>${it}</li>`).join('') + `</ul></li>`).join('') + `</ul></li></ul>`;
// TABLE + WALL
document.querySelector('#tbl tbody').innerHTML = DATA.map(d=>
  `<tr><td><b style="color:${d.color}">■</b> ${d.name}</td><td class="r">${d.items.length}</td><td>${d.use}</td></tr>`).join('');
document.getElementById('wall').innerHTML = POSTERS.map(([src,cap])=>
  `<figure><img loading="lazy" src="${src}"/><figcaption>${cap}</figcaption></figure>`).join('');
// FLOW — teach order pipeline
(function(){
  const ORDER = ['behav','logic','maps','values','paradox','organ','diderot'];
  const STEPS = ['Set the bar','Reason clean','Map it','Aim motives','Wisdom check','Gather all','Index all'];
  document.getElementById('v-flow').innerHTML =
    `<svg viewBox="0 0 900 190">` + ORDER.map((id,i)=>{
      const d = DATA.find(x=>x.id===id), x = 8+i*126;
      return `<rect x="${x}" y="30" width="112" height="76" rx="10" fill="none" stroke="${d.color}" stroke-width="2"/>` +
        `<text x="${x+56}" y="54" text-anchor="middle" class="blabel" font-size="12">${i+1}. ${d.name}</text>` +
        `<text x="${x+56}" y="74" text-anchor="middle" class="bval">${STEPS[i]}</text>` +
        `<text x="${x+56}" y="92" text-anchor="middle" class="bval">${d.items.length} elements</text>` +
        (i<6 ? `<line x1="${x+112}" y1="68" x2="${x+126}" y2="68" stroke="#00e5a0" stroke-width="2" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" repeatCount="indefinite"/></line>` : '');
    }).join('') + `</svg>` +
    `<p style="color:var(--dim);font-size:13px">Teach order: behaviours gate quality → logics reason → maps tool → values aim → paradoxes deepen → organisers gather → Diderot indexes all.</p>`;
})();
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('v-'+b.dataset.v).classList.add('on');
});
</script>
</body>
</html>
